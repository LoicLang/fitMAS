app = "fitmas"
primary_region = "cdg"  # Paris

[build]

[env]
  FITMAS_DB_PATH = "/data/fitmas.db"
  FITMAS_LLM_PROFILE = "deepseek"
  FITMAS_DEEPSEEK_MODEL = "deepseek-v4-pro"
  FITMAS_V0_DB_PATH = "/data/fitmas_v0_dogfood.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "fitmas_data"
  destination = "/data"
