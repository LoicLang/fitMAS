[project]
name = "fitmas"
version = "0.1.0"
description = "FitMAS V0 backend prototype."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "anthropic>=0.40,<1.0",
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot>=21.0,<22.0",
  "apscheduler>=3.10,<4.0",
  "httpx>=0.27,<1.0",
  "pytz>=2024.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
